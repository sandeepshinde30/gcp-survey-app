name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Inspect (Debug Step)
      run: |
        echo "--- फाइलें अनज़िप कर रहे हैं ---"
        unzip app.zip -d temp_app
        echo "--- temp_app के अंदर क्या है? ---"
        ls -la temp_app
        echo "--- क्या gradlew कहीं है? ---"
        find . -name "gradlew"
